[package]
name = "amadeus-emote-loader"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "E-mote (EMT/PSB) model data layer: parse, adapt for the legacy runtime, and bake a loadable PSB"
readme = "README.md"
repository = "https://github.com/Mieluoxxx/amadeus-emote-loader"
homepage = "https://github.com/Mieluoxxx/amadeus-emote-loader"
keywords = ["e-mote", "emote", "psb", "emt", "game"]
categories = ["parser-implementations", "game-development", "encoding"]

[dependencies]
emote-psb = "0.8"
serde_json = "1"
png = "0.18"
# 键类型必须与 emote-psb 内部使用的 SmolStr 同版本，否则类型不兼容
smol_str = "0.3"

[lib]
name = "amadeus_emote_loader"
path = "src/lib.rs"

[[bin]]
name = "emote-loader"
path = "src/bin/emote-loader.rs"

[[bin]]
name = "psb-dump"
path = "src/main.rs"

[[bin]]
name = "psb-roundtrip"
path = "src/bin/psb-roundtrip.rs"

[[bin]]
name = "psb-normalize"
path = "src/bin/psb-normalize.rs"

[[bin]]
name = "psb-resources"
path = "src/bin/psb-resources.rs"

[[bin]]
name = "psb-parts"
path = "src/bin/psb-parts.rs"
