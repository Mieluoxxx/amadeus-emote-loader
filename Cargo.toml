[package]
name = "amadeus-emote-loader"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
emote-psb = "0.8"
serde_json = "1"
png = "0.18"
# 键类型必须与 emote-psb 内部使用的 SmolStr 同版本，否则类型不兼容
smol_str = "0.3"

[lib]
name = "amadeus_emote_loader"
path = "src/lib.rs"

[[bin]]
name = "psb-dump"
path = "src/main.rs"

[[bin]]
name = "psb-roundtrip"
path = "src/bin/psb-roundtrip.rs"

[[bin]]
name = "psb-normalize"
path = "src/bin/psb-normalize.rs"

[[bin]]
name = "psb-resources"
path = "src/bin/psb-resources.rs"

[[bin]]
name = "psb-parts"
path = "src/bin/psb-parts.rs"
